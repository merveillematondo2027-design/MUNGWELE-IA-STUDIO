    <style>
      html,body,#root{min-height:100%;margin:0;background:#07101f}
      #mungwele-boot{min-height:100vh;display:grid;place-items:center;color:#fff;font-family:system-ui,sans-serif;background:#07101f;padding:24px;box-sizing:border-box}
      #mungwele-boot .boot-box{text-align:center;max-width:360px}
      #mungwele-boot .boot-spinner{width:28px;height:28px;margin:0 auto 18px;border:3px solid rgba(167,139,250,.2);border-top-color:#c084fc;border-radius:999px;animation:mungwele-spin .8s linear infinite}
      #mungwele-boot .boot-title{font-size:14px;font-weight:800;letter-spacing:.02em;color:#c4c9d4}
      #mungwele-boot .boot-help{display:none;margin-top:12px;font-size:12px;line-height:1.55;color:#7f8ba3}
      #mungwele-boot .boot-retry{display:none;margin:16px auto 0;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 15px;background:#111b30;color:#fff;font-weight:800}
      #mungwele-boot.slow .boot-help,#mungwele-boot.slow .boot-retry{display:block}
      @keyframes mungwele-spin{to{transform:rotate(360deg)}}
    </style>

  <body class="bg-[#081226] text-white font-['Plus_Jakarta_Sans',sans-serif] antialiased selection:bg-purple-600 selection:text-white min-h-screen">
    <div id="root">
      <div id="mungwele-boot">
        <div class="boot-box">
          <div class="boot-spinner" aria-hidden="true"></div>
          <div class="boot-title">Chargement de MUNGWELE IA…</div>
          <div class="boot-help">La connexion prend plus de temps que prévu. Vous pouvez réessayer sans perdre votre compte.</div>
          <button class="boot-retry" type="button" onclick="location.reload()">Réessayer</button>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const timer = window.setTimeout(() => document.getElementById('mungwele-boot')?.classList.add('slow'), 10000);
        window.addEventListener('mungwele:booted', () => window.clearTimeout(timer), { once: true });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
