name: MUNGWELE IA Classic Hosting Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'assets/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/hosting-deploy.yml'
  workflow_dispatch:

jobs:
  deploy-hosting:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production build
        run: npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Auth candidate 1
        id: auth1
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/582509216306/locations/global/workloadIdentityPools/github-actions/providers/mungwele-ia'
          service_account: '582509216306-compute@developer.gserviceaccount.com'

      - name: Deploy with candidate 1
        id: deploy1
        if: steps.auth1.outcome == 'success'
        continue-on-error: true
        run: firebase deploy --only hosting --project diablo-design-ai --non-interactive

      - name: Auth candidate 2
        id: auth2
        if: steps.deploy1.outcome != 'success'
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/582509216306/locations/global/workloadIdentityPools/github-actions/providers/github'
          service_account: '582509216306-compute@developer.gserviceaccount.com'

      - name: Deploy with candidate 2
        id: deploy2
        if: steps.auth2.outcome == 'success' && steps.deploy1.outcome != 'success'
        continue-on-error: true
        run: firebase deploy --only hosting --project diablo-design-ai --non-interactive

      - name: Auth candidate 3
        id: auth3
        if: steps.deploy1.outcome != 'success' && steps.deploy2.outcome != 'success'
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/582509216306/locations/global/workloadIdentityPools/github-actions/providers/github-actions'
          service_account: '582509216306-compute@developer.gserviceaccount.com'

      - name: Deploy with candidate 3
        id: deploy3
        if: steps.auth3.outcome == 'success' && steps.deploy1.outcome != 'success' && steps.deploy2.outcome != 'success'
        continue-on-error: true
        run: firebase deploy --only hosting --project diablo-design-ai --non-interactive

      - name: Auth candidate 4
        id: auth4
        if: steps.deploy1.outcome != 'success' && steps.deploy2.outcome != 'success' && steps.deploy3.outcome != 'success'
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/582509216306/locations/global/workloadIdentityPools/github/providers/github'
          service_account: '582509216306-compute@developer.gserviceaccount.com'

      - name: Deploy with candidate 4
        id: deploy4
        if: steps.auth4.outcome == 'success' && steps.deploy1.outcome != 'success' && steps.deploy2.outcome != 'success' && steps.deploy3.outcome != 'success'
        continue-on-error: true
        run: firebase deploy --only hosting --project diablo-design-ai --non-interactive

      - name: Require successful Hosting deployment
        if: steps.deploy1.outcome != 'success' && steps.deploy2.outcome != 'success' && steps.deploy3.outcome != 'success' && steps.deploy4.outcome != 'success'
        run: exit 1
