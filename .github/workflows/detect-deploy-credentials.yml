name: Detect MUNGWELE Deploy Credentials

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/detect-deploy-credentials.yml'
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - name: Detect configured credentials without exposing values
        shell: bash
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_CI_TOKEN: ${{ secrets.FIREBASE_CI_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_DIABLO_DESIGN_AI: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DIABLO_DESIGN_AI }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
        run: |
          for name in FIREBASE_TOKEN FIREBASE_CI_TOKEN FIREBASE_SERVICE_ACCOUNT FIREBASE_SERVICE_ACCOUNT_DIABLO_DESIGN_AI GOOGLE_CREDENTIALS GCP_SA_KEY GOOGLE_SERVICE_ACCOUNT_JSON WIF_PROVIDER WIF_SERVICE_ACCOUNT; do
            if [ -n "${!name:-}" ]; then echo "$name=present"; else echo "$name=absent"; fi
          done
