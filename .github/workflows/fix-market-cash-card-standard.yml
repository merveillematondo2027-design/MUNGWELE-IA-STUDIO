name: Fix Market-Cash card standard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-market-cash-card-standard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Mungwele Market-Cash card prefix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server/marketCashPaymentProxy.ts')
          s = p.read_text()
          old = '4585020002'
          new = '5585020002'
          if old not in s:
              raise SystemExit('Old Market-Cash card prefix not found')
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/marketCashPaymentProxy.ts
          git commit -m "Use current Market-Cash 5585 card standard"
          git push
